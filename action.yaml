name: Translation Sync

description: |
  Sync translation files to and from an s3-compatible remote bucket. This uses
  `@get-bridge/sync-format-message-translations` and thus requires authentication
  with Github Packages.

  Supports two authentication methods:
  1. **OIDC (recommended):** Pass `role-to-assume` and ensure the calling workflow
     has `permissions: id-token: write`. No static credentials needed.
  2. **Static credentials (legacy):** Set `AWS_ACCESS_KEY_ID` and
     `AWS_SECRET_ACCESS_KEY` as environment variables.

inputs:
  config:
    required: false
    default: translation-sync.json
    description: Path to the JSON-formatted configuration file.
  role-to-assume:
    required: false
    description: IAM role ARN to assume via GitHub OIDC. When set, static AWS credentials are not needed.
  aws-region:
    required: false
    default: us-east-1
    description: AWS region for the S3 buckets.

runs:
  using: composite
  steps:
    - name: Configure AWS credentials via OIDC
      if: inputs.role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Run @get-bridge/sync-format-message-translations
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        npx @get-bridge/sync-format-message-translations@^1.5.1 sync-translations --config "${INPUT_CONFIG:-TRANSLATION_SYNC_CONFIG}" --ignore-jira
